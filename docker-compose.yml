# Shared settings for the three test backends (YAML anchor, merged with <<: below).
# backend/Dockerfile is the stock Python image plus psutil (for the heartbeat
# agent); the code is mounted read-only, so code edits need no rebuild.
x-backend: &backend
  build: ./backend
  image: adaptive-lb-backend
  working_dir: /app
  volumes:
    - ./backend:/app/backend:ro
  environment:
    PYTHONUNBUFFERED: "1"  # show print() output in `docker compose logs` immediately
  # A tiny init process as PID 1 forwards SIGTERM to Python, so `docker compose
  # stop` is instant. (PID 1 ignores signals it has no handler for, so without
  # this Docker waits 10 s and then sends SIGKILL.)
  init: true
  restart: unless-stopped
  # Heartbeats go to the LB running on the host. Docker Desktop provides the
  # host.docker.internal name; on Linux this line maps it to the host gateway
  # (there, set [heartbeat] host = "0.0.0.0" in lb.toml, since the datagrams
  # arrive on the bridge interface rather than loopback).
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  # Three backends with different artificial delays. They listen on 0.0.0.0
  # inside their containers (127.0.0.1 there would be unreachable from outside)
  # and are published only on this machine's loopback, where lb.toml points.
  backend-fast:
    <<: *backend
    container_name: adaptive-lb-backend-fast
    command: >-
      python -m backend.app --host 0.0.0.0 --port 9001 --name fast --delay-ms 20
      --heartbeat host.docker.internal:9100 --advertise 127.0.0.1:9001
    ports:
      - "127.0.0.1:9001:9001"

  backend-medium:
    <<: *backend
    container_name: adaptive-lb-backend-medium
    command: >-
      python -m backend.app --host 0.0.0.0 --port 9002 --name medium --delay-ms 60
      --heartbeat host.docker.internal:9100 --advertise 127.0.0.1:9002
    ports:
      - "127.0.0.1:9002:9002"

  backend-slow:
    <<: *backend
    container_name: adaptive-lb-backend-slow
    command: >-
      python -m backend.app --host 0.0.0.0 --port 9003 --name slow --delay-ms 150
      --heartbeat host.docker.internal:9100 --advertise 127.0.0.1:9003
    ports:
      - "127.0.0.1:9003:9003"

  postgres:
    image: postgres:16
    container_name: adaptive-lb-postgres
    # Credentials come from .env so no secrets live in this file.
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Named volume: data survives `docker compose down` (use `down -v` to wipe).
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready only reports "accepting connections"; it is what
      # `depends_on: condition: service_healthy` will wait on in later phases.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Live dashboard (Flask + Chart.js) on http://127.0.0.1:5050. It reads Postgres
  # over the Compose network and the LB's admin API on the host (the LB itself
  # runs on the host: `python -m lb.server`).
  dashboard:
    build: ./dashboard
    image: adaptive-lb-dashboard
    container_name: adaptive-lb-dashboard
    working_dir: /app
    volumes:
      - ./dashboard:/app/dashboard:ro
      - ./lb:/app/lb:ro
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
      # Inside the Compose network Postgres is "postgres:5432", not localhost:5433.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      LB_ADMIN_URL: http://host.docker.internal:8081
    command: python -m dashboard.app --host 0.0.0.0 --port 5050
    ports:
      - "127.0.0.1:5050:5050"
    init: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
